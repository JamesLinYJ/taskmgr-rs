# Temporary branch-only workflow. It applies the reviewed root-cause patch, validates it on the
# repository's native Windows toolchain, and removes itself before publishing the final commit.
name: Apply open issue root-cause fixes

on:
  push:
    branches:
      - agent/fix-open-issue-root-causes
    paths:
      - scripts/agent_fix_open_issues.py
      - scripts/agent_fix_ci_lints.py
      - .github/workflows/agent-apply-open-issue-fixes.yml

permissions:
  contents: write

concurrency:
  group: agent-open-issue-fixes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply reviewed source transformations
        run: |
          python scripts/agent_fix_open_issues.py
          python scripts/agent_fix_ci_lints.py

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable `
            --component rustfmt `
            --component clippy `
            --target x86_64-pc-windows-msvc
          rustup show active-toolchain

      - name: Format source
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run strict Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Check whitespace
        run: git diff --check

      - name: Publish final source-only commit
        run: |
          Remove-Item scripts/agent_fix_open_issues.py
          Remove-Item scripts/agent_fix_ci_lints.py
          Remove-Item .github/workflows/agent-apply-open-issue-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if (git diff --cached --quiet) {
            throw "The validated transformation produced no source changes."
          }
          git commit -m "Fix open issue root causes"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
